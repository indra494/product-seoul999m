<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>서울 지하 999M 오프닝 v6 렌더러</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block;width:1920px;height:1080px}</style></head>
<body><canvas id="opening" width="1920" height="1080"></canvas><script>
const W=1920,H=1080,FPS=30,DURATION=20,NARRATION_START=.35,GLITCH_START=13.25,GLITCH_END=15.65,LOGO_START=17;
const ROOT="../../../3. 설계/영상/프롤로그/v6/";
const canvas=document.querySelector("#opening"),ctx=canvas.getContext("2d",{alpha:false});
const archive=[
 "지상은 죽었다.",
 "하늘은 독성 먼지로 뒤덮였고, 인류는 더 이상 그곳에서 숨을 쉴 수 없었다.",
 "살아남은 사람들은 땅속으로 내려갔다.",
 "지하 999미터. 과거에 건설된 공기 정화층이 아직 작동하는, 마지막 생존 가능 구역이었다.",
 "서울도 그곳에 새로운 도시를 세웠다.",
 "전력망과 공장, 통신망은 무너졌고 사람들은 버려진 기계와 고철을 이어 붙이며 문명을 다시 시작했다.",
 "세계의 지하 도시들은 비밀 터널로 연결되었다.",
 "자원과 연구 자료가 오갔고, 각 도시의 연구자들은 언젠가 지상을 되살리기 위한 연구를 계속했다.",
 "하지만 터널을 통해 오간 것은 희망만이 아니었다.",
 "부족한 자원, 정체불명의 생물, 그리고 주인을 잃은 기계들이 도시 사이의 어둠을 차지하기 시작했다.",
 "우리는 서울의 ‘두더지’ 대원이라고 불린다.",
 "땅을 파고, 자원을 찾고, 새로운 도시로 향하는 길을 만드는 사람.",
 "오늘도 평범한 굴착 작업이어야 했다.",
 "우리가 먼저 이곳에 온 것이 아니라는 사실을 발견하기 전까지는."
];
const backgrounds=[
 {start:0,end:3.1,image:"scene-01-dead-seoul.png",pan:-.02,zoom:[1.02,1.08]},
 {start:3.1,end:5.4,image:"scene-02-descent.png",pan:.025,zoom:[1.03,1.10]},
 {start:5.4,end:7.3,image:"scene-03-air-purification-layer.png",pan:-.018,zoom:[1.03,1.10]},
 {start:7.3,end:9.2,image:"scene-04-underground-seoul.png",pan:.02,zoom:[1.02,1.08]},
 {start:9.2,end:11.65,image:"scene-06-secret-tunnels.png",pan:-.025,zoom:[1.03,1.11]},
 {start:11.65,end:13.8,image:"scene-07-tunnel-threats.png",pan:.03,zoom:[1.04,1.14]},
 {start:13.8,end:LOGO_START,image:"scene-08-discovery.png",pan:.045,zoom:[1.10,1.20]}
];
const assetNames=[...new Set(backgrounds.map(x=>x.image)),"logo.png"],images=new Map();
let audio,audioOutput,voiceBuffer,scrollLayout; const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
function transparentLogo(image){const c=document.createElement("canvas"),x=c.getContext("2d");c.width=image.width;c.height=image.height;x.drawImage(image,0,0);const p=x.getImageData(0,0,c.width,c.height);for(let i=0;i<p.data.length;i+=4){const lo=Math.min(p.data[i],p.data[i+1],p.data[i+2]),hi=Math.max(p.data[i],p.data[i+1],p.data[i+2]);if(lo>215&&hi-lo<12)p.data[i+3]=Math.round(p.data[i+3]*(1-smooth((lo-215)/24)))}x.clearRect(0,0,c.width,c.height);x.putImageData(p,0,0);return c}
function loadImage(name){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{images.set(name,name==="logo.png"?transparentLogo(i):i);ok()};i.onerror=no;i.src=ROOT+"images/"+name})}
async function loadVoice(){const r=await fetch(ROOT+"audio/narration-female-heami.wav"),d=new AudioContext({sampleRate:48000});voiceBuffer=await d.decodeAudioData(await r.arrayBuffer());await d.close();if(voiceBuffer.duration+NARRATION_START<GLITCH_START)throw Error("Narration ends before the planned interruption.")}
function buildScroll(){ctx.save();ctx.font="500 43px 'Malgun Gothic',sans-serif";const max=1450,lines=[];let y=0;for(const sentence of archive){let line="";for(const word of sentence.split(" ")){const next=line?line+" "+word:word;if(ctx.measureText(next).width>max&&line){lines.push({text:line,y});y+=62;line=word}else line=next}if(line){lines.push({text:line,y});y+=62}y+=20}ctx.restore();return lines}
function cover(image,progress,scene,alpha=1){const base=Math.max(W/image.width,H/image.height),scale=base*(scene.zoom[0]+(scene.zoom[1]-scene.zoom[0])*smooth(progress)),w=image.width*scale,h=image.height*scale;ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;ctx.drawImage(image,(W-w)/2+scene.pan*W*(progress-.5),(H-h)/2,w,h);ctx.restore()}
function vignette(){const g=ctx.createLinearGradient(0,H*.3,0,H);g.addColorStop(0,"rgba(0,0,0,.04)");g.addColorStop(1,"rgba(0,0,0,.88)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const r=ctx.createRadialGradient(W/2,H/2,H*.18,W/2,H/2,W*.72);r.addColorStop(0,"rgba(0,0,0,0)");r.addColorStop(1,"rgba(0,0,0,.6)");ctx.fillStyle=r;ctx.fillRect(0,0,W,H)}
function drawCredits(t){const glitch=t>=GLITCH_START&&t<GLITCH_END,fade=glitch?1-smooth((t-GLITCH_START)/(GLITCH_END-GLITCH_START)) : 1;if(fade<=0)return;const offset=1160-t*160+(glitch?Math.sin(t*170)*18:0);ctx.save();ctx.globalAlpha=fade;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="500 43px 'Malgun Gothic',sans-serif";ctx.fillStyle="#e8e2d5";ctx.strokeStyle="rgba(0,0,0,.88)";ctx.lineWidth=8;ctx.shadowColor="#000";ctx.shadowBlur=16;for(const line of scrollLayout){const y=offset+line.y;if(y<-80||y>H+80)continue;ctx.strokeText(line.text,W/2,y);ctx.fillText(line.text,W/2,y)}ctx.restore()}
function tear(t){if(t<GLITCH_START||t>GLITCH_END)return;const p=clamp((t-GLITCH_START)/(GLITCH_END-GLITCH_START));ctx.save();ctx.globalAlpha=.25+.4*Math.sin(t*34)**2;for(let i=0;i<18;i++){const y=(i*73+Math.floor(t*120)*19)%H,h=5+(i%4)*5,dx=((i*67+Math.floor(t*230))%150)-75;ctx.fillStyle=i%3===0?"rgba(255,60,48,.65)":i%3===1?"rgba(54,230,225,.55)":"rgba(0,0,0,.9)";ctx.fillRect(0,y,W,h);ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(dx,y+h,W,h*.7)}ctx.globalAlpha=.9;ctx.font="700 34px 'Consolas','Malgun Gothic',sans-serif";ctx.fillStyle="#f0d8c5";ctx.fillText(p<.65?"띠리리리  띠리리리  // SIGNAL FAULT":"ARCHIVE INTERRUPTED",W/2,H*.52+Math.sin(t*60)*14);ctx.restore()}
function draw(t){ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);if(t<LOGO_START){let i=backgrounds.findIndex(s=>t>=s.start&&t<s.end);if(i<0)i=backgrounds.length-1;const s=backgrounds[i],st=Math.max(0,t-s.start),dur=s.end-s.start;cover(images.get(s.image),st/dur,s);if(i>0&&st<.35)cover(images.get(backgrounds[i-1].image),1,backgrounds[i-1],1-smooth(st/.35));vignette();drawCredits(t);tear(t);if(t>GLITCH_START&&t<GLITCH_END){ctx.save();ctx.globalAlpha=.12;ctx.fillStyle="#fff";for(let i=0;i<180;i++)ctx.fillRect((i*111+Math.floor(t*1000))%W,(i*47)%H,3,2);ctx.restore()}}else{const logo=images.get("logo.png"),lt=t-LOGO_START,a=smooth(lt/.45)*smooth((DURATION-t)/.35),sc=Math.min(970/logo.width,640/logo.height)*(1+.03*smooth(lt/.6));ctx.save();ctx.globalAlpha=a;ctx.shadowColor="rgba(67,190,184,.4)";ctx.shadowBlur=40;ctx.drawImage(logo,(W-logo.width*sc)/2,(H-logo.height*sc)/2,logo.width*sc,logo.height*sc);ctx.restore()}const seed=Math.floor(t*FPS)*1664525;ctx.save();ctx.globalAlpha=.035;ctx.fillStyle=seed%2?"#d8ccb5":"#274445";for(let i=0;i<85;i++)ctx.fillRect((seed*(i+3)*17)%W,(seed*(i+11)*29)%H,2,2);ctx.restore()}
function tone(start,freq,duration,gain,type="sine"){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(audioOutput);o.start(start);o.stop(start+duration+.02)}
async function makeAudio(){audio=new AudioContext({sampleRate:48000});await audio.resume();audioOutput=audio.createMediaStreamDestination();const now=audio.currentTime,comp=audio.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=14;comp.ratio.value=3;comp.connect(audioOutput);const music=audio.createGain();music.gain.setValueAtTime(.72,now);music.gain.linearRampToValueAtTime(.96,now+GLITCH_START);music.gain.linearRampToValueAtTime(.0001,now+DURATION);music.connect(comp);const noise=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.28;const n=audio.createBufferSource(),f=audio.createBiquadFilter(),ng=audio.createGain();n.buffer=noise;n.loop=true;f.type="lowpass";f.frequency.value=155;ng.gain.value=.09;n.connect(f).connect(ng).connect(music);n.start(now);n.stop(now+DURATION);
 [36.71,55,73.42].forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=i?"triangle":"sine";o.frequency.value=hz;g.gain.value=[.13,.045,.028][i];o.connect(g).connect(music);o.start(now);o.stop(now+DURATION)});
 for(let at=1.6;at<GLITCH_START;at+=2.6){const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.setValueAtTime(52,now+at);o.frequency.exponentialRampToValueAtTime(38,now+at+.55);g.gain.setValueAtTime(.0001,now+at);g.gain.exponentialRampToValueAtTime(.09,now+at+.02);g.gain.exponentialRampToValueAtTime(.0001,now+at+.6);o.connect(g).connect(music);o.start(now+at);o.stop(now+at+.65)}
 const v=audio.createBufferSource(),vf=audio.createBiquadFilter(),vg=audio.createGain();v.buffer=voiceBuffer;vf.type="highpass";vf.frequency.value=80;vg.gain.value=1.08;v.connect(vf).connect(vg).connect(comp);v.start(now+NARRATION_START);v.stop(now+GLITCH_START-.02);
 for(let at=GLITCH_START;at<GLITCH_START+1.7;at+=.36){tone(now+at,960,.16,.23);tone(now+at+.12,1260,.12,.16)}
 const surge=audio.createOscillator(),sg=audio.createGain(),sf=audio.createBiquadFilter();surge.type="sawtooth";surge.frequency.setValueAtTime(86,now+GLITCH_START);surge.frequency.linearRampToValueAtTime(220,now+GLITCH_END);sf.type="bandpass";sf.frequency.value=250;sg.gain.setValueAtTime(.0001,now+GLITCH_START);sg.gain.exponentialRampToValueAtTime(.08,now+GLITCH_START+.25);sg.gain.exponentialRampToValueAtTime(.0001,now+GLITCH_END);surge.connect(sf).connect(sg).connect(music);surge.start(now+GLITCH_START);surge.stop(now+GLITCH_END+.05);return audioOutput.stream.getAudioTracks()[0]}
window.renderOpening=async()=>{const track=await makeAudio(),stream=new MediaStream([...canvas.captureStream(FPS).getVideoTracks(),track]),mime=MediaRecorder.isTypeSupported("video/mp4;codecs=avc1.42E01E")?"video/mp4;codecs=avc1.42E01E":"video/mp4",rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3900000,audioBitsPerSecond:160000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise((ok,no)=>{rec.addEventListener("stop",ok,{once:true});rec.addEventListener("error",no,{once:true})});rec.start(1000);const start=performance.now();await new Promise(ok=>{function frame(n){const t=Math.min((n-start)/1000,DURATION);draw(t);t>=DURATION?ok():requestAnimationFrame(frame)}requestAnimationFrame(frame)});rec.stop();await stopped;stream.getTracks().forEach(x=>x.stop());await audio.close();const blob=new Blob(chunks,{type:mime}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="seoul-999m-opening-v6.mp4";a.click();return{size:blob.size,mimeType:mime,duration:DURATION,narrationDuration:voiceBuffer.duration}};
Promise.all([...assetNames.map(loadImage),loadVoice()]).then(()=>{scrollLayout=buildScroll();draw(0);window.__openingReady=true}).catch(e=>{window.__openingError=String(e.stack||e);console.error(e)});
</script></body></html>
