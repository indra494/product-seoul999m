<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>서울 지하 999M 오프닝 v2 렌더러</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 1920px; height: 1080px; background: #000; }
  </style>
</head>
<body>
  <canvas id="opening" width="1920" height="1080"></canvas>
  <script>
    const W = 1920;
    const H = 1080;
    const FPS = 30;
    const DURATION = 99;
    const ASSET_ROOT = "../../../3. 설계/영상/프롤로그/v2/images/";
    const canvas = document.querySelector("#opening");
    const ctx = canvas.getContext("2d", { alpha: false });

    const scenes = [
      { start: 0, end: 5, image: "scene-01-dead-seoul.png", lines: ["지상은 죽었다."], panX: -0.025, panY: 0.01, zoom: [1.02, 1.07] },
      { start: 5, end: 11.7, image: "scene-01-dead-seoul.png", lines: ["하늘은 독성 먼지로 뒤덮였고,", "인류는 더 이상 그곳에서 숨을 쉴 수 없었다."], panX: 0.025, panY: -0.01, zoom: [1.04, 1.11] },
      { start: 11.7, end: 17.1, image: "scene-02-descent.png", lines: ["살아남은 사람들은 땅속으로 내려갔다."], panX: 0.02, panY: 0.05, zoom: [1.04, 1.10] },
      { start: 17.1, end: 25.5, image: "scene-03-air-purification-layer.png", lines: ["지하 999미터.", "과거에 건설된 공기 정화층이 아직 작동하는,", "마지막 생존 가능 구역이었다."], panX: -0.02, panY: 0.01, zoom: [1.02, 1.10] },
      { start: 25.5, end: 31.1, image: "scene-04-underground-seoul.png", lines: ["서울도 그곳에 새로운 도시를 세웠다."], panX: -0.03, panY: 0, zoom: [1.02, 1.08] },
      { start: 31.1, end: 39.8, image: "scene-05-scrap-rebuilding.png", lines: ["전력망과 공장, 통신망은 무너졌고", "사람들은 버려진 기계와 고철을 이어 붙이며", "문명을 다시 시작했다."], panX: 0.03, panY: 0, zoom: [1.02, 1.09] },
      { start: 39.8, end: 46, image: "scene-06-secret-tunnels.png", lines: ["세계의 지하 도시들은 비밀 터널로 연결되었다."], panX: 0.035, panY: 0.015, zoom: [1.03, 1.09] },
      { start: 46, end: 54.5, image: "scene-06-secret-tunnels.png", lines: ["자원과 연구 자료가 오갔고,", "각 도시의 연구자들은 언젠가 지상을 되살리기 위한", "연구를 계속했다."], panX: -0.035, panY: 0, zoom: [1.05, 1.11] },
      { start: 54.5, end: 60.2, image: "scene-07-tunnel-threats.png", lines: ["하지만 터널을 통해 오간 것은 희망만이 아니었다."], panX: 0.025, panY: 0, zoom: [1.02, 1.08] },
      { start: 60.2, end: 68.8, image: "scene-07-tunnel-threats.png", lines: ["부족한 자원, 정체불명의 생물,", "그리고 주인을 잃은 기계들이", "도시 사이의 어둠을 차지하기 시작했다."], panX: -0.025, panY: -0.01, zoom: [1.05, 1.13] },
      { start: 68.8, end: 74, image: "scene-08-discovery.png", lines: ["나는 서울의 ‘두더지’다."], panX: 0.02, panY: 0, zoom: [1.02, 1.07] },
      { start: 74, end: 81, image: "scene-08-discovery.png", lines: ["땅을 파고, 자원을 찾고,", "새로운 도시로 향하는 길을 만드는 사람."], panX: 0.035, panY: -0.01, zoom: [1.04, 1.10] },
      { start: 81, end: 86.5, image: "scene-08-discovery.png", lines: ["오늘도 평범한 굴착 작업이어야 했다."], panX: 0.04, panY: 0, zoom: [1.07, 1.12] },
      { start: 86.5, end: 94, image: "scene-08-discovery.png", lines: ["우리가 먼저 이곳에 온 것이 아니라는 사실을", "발견하기 전까지는."], panX: 0.055, panY: -0.01, zoom: [1.10, 1.18] },
    ];

    const LOGO_START = scenes.at(-1).end;

    const imageNames = [...scenes.map((scene) => scene.image), "logo.png"];
    const images = new Map();
    let audioContext;
    let audioDestination;
    let lastTypedKey = "";
    let lastTypedCount = 0;

    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const smooth = (value) => {
      const t = clamp(value);
      return t * t * (3 - 2 * t);
    };

    function removeNearWhiteLogoBackground(image) {
      const offscreen = document.createElement("canvas");
      offscreen.width = image.width;
      offscreen.height = image.height;
      const offscreenContext = offscreen.getContext("2d");
      offscreenContext.drawImage(image, 0, 0);
      const pixels = offscreenContext.getImageData(0, 0, image.width, image.height);
      for (let index = 0; index < pixels.data.length; index += 4) {
        const red = pixels.data[index];
        const green = pixels.data[index + 1];
        const blue = pixels.data[index + 2];
        const minimum = Math.min(red, green, blue);
        const maximum = Math.max(red, green, blue);
        if (minimum > 215 && maximum - minimum < 12) {
          const keep = 1 - smooth((minimum - 215) / 24);
          pixels.data[index + 3] = Math.round(pixels.data[index + 3] * keep);
        }
      }
      offscreenContext.clearRect(0, 0, image.width, image.height);
      offscreenContext.putImageData(pixels, 0, 0);
      return offscreen;
    }

    function loadImage(name) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          images.set(name, name === "logo.png" ? removeNearWhiteLogoBackground(image) : image);
          resolve();
        };
        image.onerror = reject;
        image.src = ASSET_ROOT + name;
      });
    }

    function drawCover(image, progress, scene, alpha = 1) {
      const baseScale = Math.max(W / image.width, H / image.height);
      const zoom = scene.zoom[0] + (scene.zoom[1] - scene.zoom[0]) * smooth(progress);
      const scale = baseScale * zoom;
      const drawWidth = image.width * scale;
      const drawHeight = image.height * scale;
      const travelX = scene.panX * W * (progress - 0.5);
      const travelY = scene.panY * H * (progress - 0.5);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(
        image,
        (W - drawWidth) / 2 + travelX,
        (H - drawHeight) / 2 + travelY,
        drawWidth,
        drawHeight,
      );
      ctx.restore();
    }

    function drawVignette() {
      const bottom = ctx.createLinearGradient(0, H * 0.48, 0, H);
      bottom.addColorStop(0, "rgba(0,0,0,0)");
      bottom.addColorStop(0.58, "rgba(0,0,0,0.28)");
      bottom.addColorStop(1, "rgba(0,0,0,0.92)");
      ctx.fillStyle = bottom;
      ctx.fillRect(0, 0, W, H);

      const radial = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, W * 0.72);
      radial.addColorStop(0, "rgba(0,0,0,0)");
      radial.addColorStop(1, "rgba(0,0,0,0.67)");
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, W, H);
    }

    function playTypeClick() {
      if (!audioContext || !audioDestination) return;
      const duration = 0.018;
      const count = Math.floor(audioContext.sampleRate * duration);
      const buffer = audioContext.createBuffer(1, count, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < count; i += 1) {
        const falloff = 1 - i / count;
        data[i] = (Math.random() * 2 - 1) * falloff * 0.06;
      }
      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1150;
      filter.Q.value = 1.6;
      source.buffer = buffer;
      source.connect(filter).connect(audioDestination);
      source.start();
    }

    function drawTypedLines(lines, sceneTime, key, centerY = 835) {
      const full = lines.join("\n");
      const delay = 0.72;
      const charRate = 12.5;
      const count = clamp(Math.floor((sceneTime - delay) * charRate), 0, Array.from(full).length);
      const typed = Array.from(full).slice(0, count).join("");

      if (key !== lastTypedKey) {
        lastTypedKey = key;
        lastTypedCount = 0;
      }
      if (count > lastTypedCount && count < Array.from(full).length) {
        const latest = Array.from(full)[count - 1];
        if (latest && !/[\s.,!?‘’]/.test(latest)) playTypeClick();
        lastTypedCount = count;
      }

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "600 48px 'Malgun Gothic', 'Noto Sans KR', sans-serif";
      ctx.fillStyle = "#e3dfd2";
      ctx.shadowColor = "rgba(0,0,0,0.96)";
      ctx.shadowBlur = 18;
      ctx.lineWidth = 7;
      ctx.strokeStyle = "rgba(0,0,0,0.82)";

      const typedLines = typed.split("\n");
      const lineHeight = 74;
      const firstY = centerY - ((typedLines.length - 1) * lineHeight) / 2;
      typedLines.forEach((line, index) => {
        const y = firstY + index * lineHeight;
        ctx.strokeText(line, W / 2, y);
        ctx.fillText(line, W / 2, y);
      });

      if (count < Array.from(full).length && Math.floor(sceneTime * 3) % 2 === 0) {
        const activeLine = typedLines.at(-1) || "";
        const width = ctx.measureText(activeLine).width;
        const cursorY = firstY + (typedLines.length - 1) * lineHeight;
        ctx.fillStyle = "#6bb6b5";
        ctx.fillRect(W / 2 + width / 2 + 11, cursorY - 25, 4, 50);
      }
      ctx.restore();
    }

    function drawScene(t) {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      const sceneIndex = scenes.findIndex((scene) => t >= scene.start && t < scene.end);
      if (sceneIndex >= 0) {
        const scene = scenes[sceneIndex];
        const sceneTime = t - scene.start;
        const progress = sceneTime / (scene.end - scene.start);
        drawCover(images.get(scene.image), progress, scene);

        const transition = 0.75;
        if (sceneIndex > 0 && sceneTime < transition) {
          const previous = scenes[sceneIndex - 1];
          drawCover(images.get(previous.image), 1, previous, 1 - smooth(sceneTime / transition));
        }

        drawVignette();
        const fadeIn = smooth(sceneTime / 0.8);
        const fadeOut = smooth((scene.end - t) / 0.65);
        ctx.save();
        ctx.globalAlpha = Math.min(fadeIn, fadeOut);
        drawTypedLines(scene.lines, sceneTime, `scene-${sceneIndex}`);
        ctx.restore();
      } else {
        const logoTime = t - LOGO_START;
        const logo = images.get("logo.png");
        const appear = smooth(logoTime / 1.2);
        const fadeOut = smooth((DURATION - t) / 0.75);
        const scale = 0.73 + appear * 0.05;
        const maxWidth = 1280 * scale;
        const maxHeight = 780 * scale;
        const imageScale = Math.min(maxWidth / logo.width, maxHeight / logo.height);
        const width = logo.width * imageScale;
        const height = logo.height * imageScale;
        ctx.save();
        ctx.globalAlpha = appear * fadeOut;
        ctx.shadowColor = "rgba(76, 170, 170, 0.28)";
        ctx.shadowBlur = 32;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(logo, (W - width) / 2, (H - height) / 2 - 12, width, height);
        ctx.restore();
      }

      const grainSeed = Math.floor(t * FPS) * 1664525 + 1013904223;
      ctx.save();
      ctx.globalAlpha = 0.035;
      ctx.fillStyle = grainSeed % 2 ? "#d8ccb5" : "#274445";
      for (let i = 0; i < 90; i += 1) {
        const x = (grainSeed * (i + 3) * 17) % W;
        const y = (grainSeed * (i + 11) * 29) % H;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.restore();
    }

    async function createAudioTrack() {
      audioContext = new AudioContext({ sampleRate: 48000 });
      await audioContext.resume();
      audioDestination = audioContext.createMediaStreamDestination();

      const now = audioContext.currentTime;
      const compressor = audioContext.createDynamicsCompressor();
      compressor.threshold.value = -20;
      compressor.knee.value = 16;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.015;
      compressor.release.value = 0.45;
      compressor.connect(audioDestination);

      const master = audioContext.createGain();
      master.gain.setValueAtTime(0.72, now);
      master.gain.setValueAtTime(0.72, now + DURATION - 3);
      master.gain.linearRampToValueAtTime(0.0001, now + DURATION);
      master.connect(compressor);

      const noiseLength = audioContext.sampleRate * 4;
      const noiseBuffer = audioContext.createBuffer(1, noiseLength, audioContext.sampleRate);
      const noiseData = noiseBuffer.getChannelData(0);
      for (let index = 0; index < noiseLength; index += 1) {
        noiseData[index] = (Math.random() * 2 - 1) * 0.32;
      }
      const noise = audioContext.createBufferSource();
      const noiseFilter = audioContext.createBiquadFilter();
      const noiseGain = audioContext.createGain();
      noise.loop = true;
      noise.buffer = noiseBuffer;
      noiseFilter.type = "lowpass";
      noiseFilter.frequency.value = 170;
      noiseGain.gain.value = 0.055;
      noise.connect(noiseFilter).connect(noiseGain).connect(master);
      noise.start(now);
      noise.stop(now + DURATION + 1);

      [36.71, 55, 73.42].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();
        oscillator.type = index === 0 ? "sine" : "triangle";
        oscillator.frequency.value = frequency;
        filter.type = "lowpass";
        filter.frequency.value = 145 + index * 55;
        gain.gain.value = [0.075, 0.025, 0.016][index];
        oscillator.connect(filter).connect(gain).connect(master);
        oscillator.start(now);
        oscillator.stop(now + DURATION + 1);
      });

      const progression = [
        [73.42, 87.31, 110],
        [65.41, 82.41, 98],
        [58.27, 73.42, 87.31],
        [55, 69.3, 82.41],
      ];
      for (let step = 0, at = 0; at < DURATION - 4; step += 1, at += 11) {
        const chord = progression[step % progression.length];
        chord.forEach((frequency, voice) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const filter = audioContext.createBiquadFilter();
          const start = now + at;
          const end = Math.min(now + at + 13, now + DURATION - 1);
          oscillator.type = voice === 0 ? "triangle" : "sine";
          oscillator.frequency.value = frequency;
          filter.type = "lowpass";
          filter.frequency.value = 380;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.026 - voice * 0.004, start + 2.2);
          gain.gain.setValueAtTime(0.022 - voice * 0.003, Math.max(start + 2.3, end - 2.4));
          gain.gain.exponentialRampToValueAtTime(0.0001, end);
          oscillator.connect(filter).connect(gain).connect(master);
          oscillator.start(start);
          oscillator.stop(end + 0.1);
        });
      }

      for (let at = 2; at < DURATION - 4; at += 3.2) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const start = now + at;
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(52, start);
        oscillator.frequency.exponentialRampToValueAtTime(38, start + 0.55);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.075, start + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);
        oscillator.connect(gain).connect(master);
        oscillator.start(start);
        oscillator.stop(start + 0.65);
      }

      scenes.slice(1).forEach((scene, index) => {
        [620 + (index % 4) * 73, 947 + (index % 3) * 91].forEach((frequency, tone) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const filter = audioContext.createBiquadFilter();
          const start = now + scene.start + tone * 0.08;
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          filter.type = "bandpass";
          filter.frequency.value = frequency;
          filter.Q.value = 7;
          gain.gain.setValueAtTime(0.022 - tone * 0.006, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.7 + tone * 0.5);
          oscillator.connect(filter).connect(gain).connect(master);
          oscillator.start(start);
          oscillator.stop(start + 2.3);
        });
      });

      const tension = audioContext.createOscillator();
      const tensionFilter = audioContext.createBiquadFilter();
      const tensionGain = audioContext.createGain();
      tension.type = "sawtooth";
      tension.frequency.value = 116.54;
      tensionFilter.type = "bandpass";
      tensionFilter.frequency.value = 155;
      tensionFilter.Q.value = 3.5;
      tensionGain.gain.setValueAtTime(0.0001, now + 53);
      tensionGain.gain.exponentialRampToValueAtTime(0.011, now + 58);
      tensionGain.gain.setValueAtTime(0.011, now + 92);
      tensionGain.gain.exponentialRampToValueAtTime(0.0001, now + 97);
      tension.connect(tensionFilter).connect(tensionGain).connect(master);
      tension.start(now + 53);
      tension.stop(now + DURATION);

      return audioDestination.stream.getAudioTracks()[0];
    }

    window.renderOpening = async () => {
      const audioTrack = await createAudioTrack();
      const canvasStream = canvas.captureStream(FPS);
      const stream = new MediaStream([...canvasStream.getVideoTracks(), audioTrack]);
      const preferred = "video/mp4;codecs=avc1.42E01E";
      const mimeType = MediaRecorder.isTypeSupported(preferred) ? preferred : "video/mp4";
      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 3_200_000,
        audioBitsPerSecond: 128_000,
      });
      const chunks = [];
      recorder.addEventListener("dataavailable", (event) => {
        if (event.data.size > 0) chunks.push(event.data);
      });

      const stopped = new Promise((resolve, reject) => {
        recorder.addEventListener("stop", resolve, { once: true });
        recorder.addEventListener("error", reject, { once: true });
      });

      recorder.start(1000);
      const startedAt = performance.now();
      await new Promise((resolve) => {
        function frame(now) {
          const elapsed = Math.min((now - startedAt) / 1000, DURATION);
          drawScene(elapsed);
          if (elapsed >= DURATION) {
            resolve();
            return;
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });
      recorder.stop();
      await stopped;

      stream.getTracks().forEach((track) => track.stop());
      await audioContext.close();
      const blob = new Blob(chunks, { type: mimeType });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "seoul-999m-opening-v2.mp4";
      document.body.appendChild(link);
      link.click();
      link.remove();
      return { size: blob.size, mimeType, duration: DURATION };
    };

    Promise.all(imageNames.map(loadImage)).then(() => {
      drawScene(0);
      window.__openingReady = true;
    });
  </script>
</body>
</html>
