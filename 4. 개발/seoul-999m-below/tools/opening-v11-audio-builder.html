<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>서울 지하 999M v11 오디오 빌더</title></head><body><script>
const ROOT="../../../3. 설계/영상/프롤로그/v11/audio/";
const SAMPLE_RATE=48000,VOICE_START=.35,STATIC_DURATION=2.7;
function parseBoundaries(text){return text.trim().split(/\r?\n/).filter(Boolean).map(JSON.parse)}
async function fetchBuffer(name,context){const response=await fetch(ROOT+name);if(!response.ok)throw Error(`${name}: ${response.status}`);return context.decodeAudioData(await response.arrayBuffer())}
function addSource(context,buffer,start,offset=0,duration,rate=1,destination=context.destination){const source=context.createBufferSource();source.buffer=buffer;source.playbackRate.value=rate;source.connect(destination);source.start(start,offset,duration);return source}
function addAlarm(context,start,end,destination){
  const length=Math.ceil((end-start)*SAMPLE_RATE),noise=context.createBuffer(1,length,SAMPLE_RATE),samples=noise.getChannelData(0);let seed=999;
  for(let i=0;i<length;i++){seed=(seed*1664525+1013904223)>>>0;const white=(seed/4294967296)*2-1;const t=i/SAMPLE_RATE;const burst=Math.max(0,1-t/.14);samples[i]=white*(.24+.42*burst)*(1-.25*t/(end-start))}
  const noiseSource=context.createBufferSource(),noiseGain=context.createGain(),high=context.createBiquadFilter();noiseSource.buffer=noise;noiseGain.gain.value=.82;high.type="highpass";high.frequency.value=900;noiseSource.connect(high).connect(noiseGain).connect(destination);noiseSource.start(start);
  for(let at=start;at<end-.3;at+=.38){for(const [delay,freq,gain] of [[0,920,.52],[.14,1380,.44]]){const oscillator=context.createOscillator(),amp=context.createGain();oscillator.type="square";oscillator.frequency.value=freq;amp.gain.setValueAtTime(.0001,at+delay);amp.gain.exponentialRampToValueAtTime(gain,at+delay+.008);amp.gain.exponentialRampToValueAtTime(.0001,at+delay+.14);oscillator.connect(amp).connect(destination);oscillator.start(at+delay);oscillator.stop(at+delay+.16)}}
  const buzz=context.createOscillator(),buzzGain=context.createGain(),buzzFilter=context.createBiquadFilter();buzz.type="sawtooth";buzz.frequency.setValueAtTime(74,start);buzz.frequency.exponentialRampToValueAtTime(240,end);buzzGain.gain.setValueAtTime(.0001,start);buzzGain.gain.exponentialRampToValueAtTime(.3,start+.08);buzzGain.gain.exponentialRampToValueAtTime(.0001,end);buzzFilter.type="bandpass";buzzFilter.frequency.value=380;buzz.connect(buzzFilter).connect(buzzGain).connect(destination);buzz.start(start);buzz.stop(end);
}
function encodeWav(buffer){const channels=buffer.numberOfChannels,length=buffer.length*channels*2,out=new ArrayBuffer(44+length),view=new DataView(out);const text=(offset,value)=>{for(let i=0;i<value.length;i++)view.setUint8(offset+i,value.charCodeAt(i))};text(0,"RIFF");view.setUint32(4,36+length,true);text(8,"WAVE");text(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);view.setUint32(24,buffer.sampleRate,true);view.setUint32(28,buffer.sampleRate*channels*2,true);view.setUint16(32,channels*2,true);view.setUint16(34,16,true);text(36,"data");view.setUint32(40,length,true);const data=[...Array(channels)].map((_,i)=>buffer.getChannelData(i));let offset=44;for(let frame=0;frame<buffer.length;frame++)for(let channel=0;channel<channels;channel++){const sample=Math.max(-1,Math.min(1,data[channel][frame]));view.setInt16(offset,sample<0?sample*32768:sample*32767,true);offset+=2}return new Blob([out],{type:"audio/wav"})}
window.buildOpeningAudio=async()=>{
  const decode=new AudioContext({sampleRate:SAMPLE_RATE});
  const [normal,next,boundaryText,nextBoundaryText]=await Promise.all([fetchBuffer("narration-normal-sunhi-neural.mp3",decode),fetchBuffer("narration-next-sunhi-neural.mp3",decode),fetch(ROOT+"narration-normal-sunhi-neural.vtt").then(r=>r.text()),fetch(ROOT+"narration-next-sunhi-neural.vtt").then(r=>r.text())]);await decode.close();
  const boundaries=parseBoundaries(boundaryText),nextBoundaries=parseBoundaries(nextBoundaryText),last=boundaries.at(-1),firstNext=nextBoundaries[0];
  const normalVoiceEnd=(last.offset+last.duration)/1e7+.20,glitchStart=VOICE_START+normalVoiceEnd,glitchEnd=glitchStart+STATIC_DURATION,logoStart=glitchEnd+1.35,duration=logoStart+3;
  const context=new OfflineAudioContext(2,Math.ceil(duration*SAMPLE_RATE),SAMPLE_RATE),voiceGain=context.createGain(),effectsGain=context.createGain(),effectsCompressor=context.createDynamicsCompressor();voiceGain.gain.value=.9;voiceGain.connect(context.destination);effectsGain.gain.value=1.55;effectsCompressor.threshold.value=-14;effectsCompressor.knee.value=6;effectsCompressor.ratio.value=5;effectsCompressor.attack.value=.003;effectsCompressor.release.value=.16;effectsGain.connect(effectsCompressor).connect(context.destination);addSource(context,normal,VOICE_START,0,normalVoiceEnd,1,voiceGain);
  const fragmentOffset=firstNext.offset/1e7,fragmentDuration=Math.max(.16,Math.min(.27,firstNext.duration/1e7+.06));
  for(let i=0;i<5;i++){const gain=context.createGain(),filter=context.createBiquadFilter(),at=glitchStart+i*.16;gain.gain.value=.96-i*.09;filter.type="bandpass";filter.frequency.value=1500+i*170;gain.connect(filter).connect(effectsGain);addSource(context,next,at,fragmentOffset,fragmentDuration,[1,.82,1.1,.68,.95][i],gain)}
  addAlarm(context,glitchStart,glitchEnd,effectsGain);const rendered=await context.startRendering(),blob=encodeWav(rendered),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="opening-final-mix.wav";a.click();
  return{size:blob.size,duration,voiceStart:VOICE_START,normalVoiceEnd:VOICE_START+normalVoiceEnd,glitchStart,glitchEnd,logoStart,normalDecodedDuration:normal.duration,nextDecodedDuration:next.duration,normalBoundaryWords:boundaries.map(x=>x.text),nextBoundaryWords:nextBoundaries.map(x=>x.text)}
};
window.__audioBuilderReady=true;
</script></body></html>
